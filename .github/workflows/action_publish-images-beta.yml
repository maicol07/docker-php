name: Docker Publish (Beta Images)

on:
  workflow_dispatch:
  release:
    types: [prereleased]
  schedule:
    - cron: '25 8 * * 1'

jobs:
  get-latest-beta-release:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.get_latest_beta.outputs.release_tag }}
    steps:
      - name: Get Latest Beta Release
        id: get_latest_beta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            LATEST_BETA="${{ github.event.release.tag_name }}"
          else
            LATEST_BETA=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/releases" | jq -r '[.[]? | select(.prerelease == true)][0].tag_name // empty')
          fi

          if [ -z "$LATEST_BETA" ] || [ "$LATEST_BETA" = "null" ]; then
            echo "No beta release tag found, falling back to ref ${{ github.ref }}"
            LATEST_BETA="${{ github.ref }}"
          fi

          echo "release_tag=${LATEST_BETA}" >> $GITHUB_OUTPUT

  build-beta-images:
    needs: get-latest-beta-release
    uses: ./.github/workflows/service_docker-build-and-publish.yml
    with:
      registry-repositories: "ghcr.io/${{ github.repository }}"
      tag-prefix: "beta"
      release-type: "testing"
      ref: ${{ needs.get-latest-beta-release.outputs.release_tag }}
    secrets: inherit