name: Docker Publish (Production Images)

on:
  workflow_dispatch:
  release:
    types: [released]
  schedule:
    - cron: '0 8 * * 2'

jobs:
  get-latest-release:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.get_latest_release.outputs.release_tag }}
    steps:
      - name: Get Latest Release
        id: get_latest_release
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            LATEST_TAG="${{ github.event.release.tag_name }}"
          else
            LATEST_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name // empty')
          fi

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "No release tag found, falling back to ref ${{ github.ref }}"
            LATEST_TAG="${{ github.ref }}"
          fi

          echo "release_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT

  build-production-images:
    needs: get-latest-release
    uses: ./.github/workflows/service_docker-build-and-publish.yml
    with:
      registry-repositories: "ghcr.io/${{ github.repository }}"
      tag-prefix: ''
      release-type: "latest"
      ref: ${{ needs.get-latest-release.outputs.release_tag }}
    secrets: inherit
